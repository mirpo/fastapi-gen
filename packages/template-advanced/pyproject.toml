[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advanced-fastapi-app"
version = "0.1.0"
description = "Advanced FastAPI application with auth, database, etc."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.8",
  "pyjwt==2.15.1",
  "bcrypt==5.0.0",
  "slowapi==0.1.10",
  "python-multipart==0.0.33",
  "email-validator==2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/advanced"]

[dependency-groups]
dev = [
  "ruff==0.17.6",
  "pytest==9.2.0",
  "httpx==0.29.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
