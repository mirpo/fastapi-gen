[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlp-fastapi-app"
version = "0.1.0"
description = "FastAPI application with NLP capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "transformers[torch]==5.18.0",
  "sentence-transformers==6.1.0",
  "pydantic-settings==2.15.0",
  "torch==2.14.1",
  "accelerate==1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nlp"]

[dependency-groups]
dev = [
  "ruff==0.15.22",
  "pytest==9.1.1",
  "httpx==0.28.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
