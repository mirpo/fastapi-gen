[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-fastapi-app"
version = "0.1.0"
description = "FastAPI application with LangChain integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "transformers[torch]==5.24.1",
  "pydantic-settings==2.16.3",
  "torch==2.15.0",
  "langchain==1.5.0",
  "langchain-community==0.4.2",
  "langchain-huggingface==1.2.3",
  "accelerate==1.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_app"]

[dependency-groups]
dev = [
  "ruff==0.17.5",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "httpx==0.28.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
